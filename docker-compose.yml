name: flowtime

services:
  db:
    image: postgres:16-alpine
    pull_policy: if_not_present
    environment:
      POSTGRES_DB: flowtime
      POSTGRES_USER: flowtime
      POSTGRES_PASSWORD: flowtime
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtime -d flowtime"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    pull_policy: if_not_present
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend/backend
      pull: false
    pull_policy: build
    environment:
      DATABASE_URL: postgres://flowtime:flowtime@db:5432/flowtime
      REDIS_URL: redis://redis:6379/1
      DJANGO_SETTINGS_MODULE: config.settings
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_COOKIE_SECURE: "false"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SAMESITE: Lax
      SESSION_COOKIE_SAMESITE: Lax
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
      pull: false
    pull_policy: build
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
