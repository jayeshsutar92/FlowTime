services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowtime
      POSTGRES_USER: flowtime
      POSTGRES_PASSWORD: flowtime
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtime -d flowtime"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend/backend
    environment:
      DATABASE_URL: postgres://flowtime:flowtime@db:5432/flowtime
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
